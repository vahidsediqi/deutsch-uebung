<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hören Übungssatz 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one Teil per screen, exam-booklet header band, sticky bottom action bar */
:root {
  --bg: #eef0ee;
  --paper: #fbfcfb;
  --ink: #1d2320;
  --muted: #5c6661;
  --band: #b9bfbb;
  --band-ink: #1d2320;
  --line: #d5dad7;
  --accent: #1f7a3d;
  --accent-soft: #e2f1e6;
  --wrong: #b3261e;
  --wrong-soft: #fbe7e5;
  --font-body: "Fira Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Fira Sans Condensed", "Fira Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --paper: #1b201d; --ink: #e8ece9; --muted: #9ba59f;
    --band: #353c38; --band-ink: #e8ece9; --line: #2f3632;
    --accent: #5cc47c; --accent-soft: #1d3324; --wrong: #f2857c; --wrong-soft: #3a1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --paper: #1b201d; --ink: #e8ece9; --muted: #9ba59f;
  --band: #353c38; --band-ink: #e8ece9; --line: #2f3632;
  --accent: #5cc47c; --accent-soft: #1d3324; --wrong: #f2857c; --wrong-soft: #3a1f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px; margin: 0 auto; min-height: 100vh;
  display: flex; flex-direction: column;
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps span { height: 5px; border-radius: 3px; background: var(--line); transition: background .25s; }
.steps span.on { background: var(--accent); }
.step-label { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

main {
  flex: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 120px;
}
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.band {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--band); color: var(--band-ink); padding: 10px 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
}
.band small { font-family: var(--font-body); font-weight: 500; font-size: 14px; }
.ear { width: 30px; height: 30px; border: 1.5px solid currentColor; border-radius: 4px; display: grid; place-items: center; flex: none; }
.inner { padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.intro { margin: 0; font-style: italic; color: var(--muted); font-size: 15px; }
.intro p { margin: 0 0 4px; }

.beispiel { background: var(--band); color: var(--band-ink); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.beispiel b { display: block; margin-bottom: 6px; }
.beispiel ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.beispiel .tag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

.q { display: flex; flex-direction: column; gap: 10px; }
.q-head { display: flex; gap: 12px; align-items: baseline; font-weight: 600; font-size: 17px; }
.num { flex: none; min-width: 26px; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; padding-left: 38px; }
.opts.row { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer;
  min-height: 46px; transition: border-color .15s, background .15s;
}
.opt .key { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; line-height: 1; margin-top: 1px; }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.opts.row .opt { justify-content: center; align-items: center; font-weight: 600; }

.saetze { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.saetze li { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.saetze .letter { flex: none; font-family: var(--font-display); font-weight: 700; width: 16px; }
.match { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding-left: 38px; }
.match .opt { justify-content: center; padding: 10px 0; font-weight: 600; text-transform: lowercase; }
.divider { height: 1px; background: var(--line); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
.btns { display: flex; gap: 10px; }
.btn {
  flex: 1; font: inherit; font-weight: 600; font-size: 17px; border-radius: 12px; padding: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); flex: 2; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: default; }

/* Ergebnis */
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.tile.ok { background: var(--accent-soft); color: var(--accent); }
.tile.bad { background: var(--wrong-soft); color: var(--wrong); }
.tile strong { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-weight: 600; font-size: 14px; }
.verdict { margin: 0; font-size: 15px; color: var(--muted); }
.review { display: grid; gap: 14px; }
.review h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; }
.rv { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.rv .num { font-size: 15px; }
.rv .ans { font-size: 13px; color: var(--muted); }
.rv .ans b { color: var(--ink); font-weight: 600; }
.mark { font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.mark.ok { background: var(--accent-soft); color: var(--accent); }
.mark.bad { background: var(--wrong-soft); color: var(--wrong); }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
.home { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top" id="top">
    <a class="home" href="./">← Übersicht</a>
    <div class="steps" id="steps"><span></span><span></span><span></span><span></span></div>
    <div class="step-label"><span id="stepName">Teil 1 von 4</span><span id="answered">0 / 20 beantwortet</span></div>
  </header>
  <main id="main"></main>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="note" id="note"></div>
    <div class="btns">
      <button class="btn" id="back" type="button">Zurück</button>
      <button class="btn primary" id="next" type="button">Weiter</button>
    </div>
  </div>
</div>

<script>
const EAR = '<span class="ear" aria-hidden="true"><svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-5 2"/><path d="M7 7a2 2 0 0 1 4 0c0 1.5-1.5 2-1.5 3.5"/></svg></span>';

const TEILE = [
  {
    title: "Teil 1",
    intro: [
      "Sie hören vier Aussagen. Zu jeder Aussage gibt es eine Aufgabe.",
      "Welche Lösung (a, b oder c) passt am besten?",
      "Markieren Sie Ihre Lösungen für die Aufgaben 1–4 auf dem Antwortbogen."
    ],
    questions: [
      { n: 1, text: "Wann standen die Schule im Haustür?", opts: ["Am ersten Mai.", "Am dritten Mai.", "Am vierten Mai."], answer: 0 },
      { n: 2, text: "Frau Fäth soll", opts: ["die Arztrechnung möglichst bald bezahlen.", "einen Termin in der Praxis vereinbaren.", "Ihre Versichertenkarte in die Praxis bringen."], answer: 2 },
      { n: 3, text: "An welchem Tag ist das Fundbüro noch um 18 Uhr geöffnet?", opts: ["Am Mittwoch.", "Am Donnerstag.", "Am Freitag."], answer: 1 },
      { n: 4, text: "Sie möchten einen Mitarbeiter sprechen. Was müssen Sie tun?", opts: ["Die Bankleitzahl eingeben.", "Die Taste 2 drücken.", "Die Taste 3 drücken."], answer: 2 }
    ]
  },
  {
    title: "Teil 2",
    intro: [
      "Sie hören fünf Aussagen aus dem Radio. Zu jeder Aussage gibt es eine Aufgabe.",
      "Welche Lösung (a, b oder c) passt am besten?",
      "Markieren Sie Ihre Lösungen für die Aufgaben 5–9 auf dem Antwortbogen."
    ],
    questions: [
      { n: 5, text: "Was kann man gewinnen?", opts: ["Eine Monatskarte.", "Eintrittskarten für das Schwimmbad.", "Gutscheine für das Kino."], answer: 2 },
      { n: 6, text: "Was kann man im Fitnessstudio machen?", opts: ["Die Kurse testen.", "Joggen.", "Schwimmen."], answer: 0 },
      { n: 7, text: "Der IC nach Kiel", opts: ["fährt heute nach Plan.", "fährt heute nicht.", "fährt heute später."], answer: 2 },
      { n: 8, text: "Die deutsche Fußballmannschaft spielt heute gegen", opts: ["die Niederlande.", "Nordirland.", "Weißrussland."], answer: 0 },
      { n: 9, text: "Womit können Sie heute fahren?", opts: ["Mit dem Bus.", "Mit der S-Bahn.", "Mit der Straßenbahn."], answer: 1 }
    ]
  },
  {
    title: "Teil 3",
    intro: [
      "Sie hören vier Gespräche. Zu jedem Gespräch gibt es zwei Aufgaben.",
      "Entscheiden Sie bei jedem Gespräch, ob die Aussage dazu richtig oder falsch ist und welche Antwort (a, b oder c) am besten passt.",
      "Markieren Sie Ihre Lösungen für die Aufgaben 10–17 auf dem Antwortbogen."
    ],
    beispiel: `<b>Beispiel</b>
      Die beiden Frauen kennen sich. <span class="tag">→ richtig</span>
      <div style="margin-top:8px">Was ist Anjas Problem?</div>
      <ol><li>a&nbsp; Ihre Tochter ist krank.</li><li><b style="display:inline">b&nbsp; Ihre Tochter ist morgen Nachmittag allein. ✓</b></li><li>c&nbsp; Sie braucht einmal pro Woche eine Babysitterin.</li></ol>`,
    questions: [
      { n: 10, text: "Der Mann möchte der Frau etwas verkaufen.", rf: true, answer: 1 },
      { n: 11, text: "Die Frau hat", opts: ["am Samstag einen Film gesehen.", "am Sonntag ferngesehen.", "letztes Wochenende nicht ferngesehen."], answer: 0 },
      { n: 12, text: "Frau Ziller ist neu in der Firma.", rf: true, answer: 0 },
      { n: 13, text: "Frau Ziller", opts: ["arbeitet im Zimmer von Herrn Bach.", "hat insgesamt vier Kollegen.", "ist die einzige Frau in der Firma."], answer: 2 },
      { n: 14, text: "Lenka feiert am Wochenende ihren Geburtstag.", rf: true, answer: 1 },
      { n: 15, text: "Lenka", opts: ["backt einen Kuchen.", "bringt Brot mit.", "kauft Plastik-Geschirr."], answer: 1 },
      { n: 16, text: "Die Frau ist Herrn Kosacks Chefin.", rf: true, answer: 0 },
      { n: 17, text: "Warum ist Herr Kosack nicht ganz glücklich?", opts: ["Er hat ein Problem mit Kollegen.", "Er hat private Sorgen.", "Seine Tochter ist krank."], answer: 1 }
    ]
  },
  {
    title: "Teil 4",
    intro: [
      "Sie hören Aussagen zu einem Thema. Welcher der Sätze a–f passt zu den Aussagen 18–20?",
      "Markieren Sie Ihre Lösungen für die Aufgaben 18–20 auf dem Antwortbogen.",
      "Lesen Sie jetzt die Sätze a–f. Dazu haben Sie eine Minute Zeit.",
      "Danach hören Sie die Aussagen."
    ],
    saetze: [
      "Durch Handys sprechen die Leute mehr miteinander.",
      "Handys können auch stören.",
      "Handys sind gefährlich für den Straßenverkehr.",
      "Handys sind schlecht für Kinder und Jugendliche.",
      "Moderne Geräte machen das Leben einfacher.",
      "Viele Funktionen bei einem Handy braucht man nicht."
    ],
    questions: [
      { n: 18, text: "Aussage 18", match: true, answer: 4 },
      { n: 19, text: "Aussage 19", match: true, answer: 1 },
      { n: 20, text: "Aussage 20", match: true, answer: 3 }
    ]
  }
];

const ALL = TEILE.flatMap(t => t.questions);
const LETTERS = "abcdef";
const answers = {};
let page = 0; // 0..3 = Teile, 4 = Ergebnis

const $ = id => document.getElementById(id);

function optLabel(q, i) {
  if (q.rf) return i === 0 ? "richtig" : "falsch";
  if (q.match) return LETTERS[i] + ") " + TEILE[3].saetze[i];
  return LETTERS[i] + ") " + q.opts[i];
}

function questionHTML(q) {
  const sel = answers[q.n];
  const btn = (i, inner, extra = "") =>
    `<button type="button" class="opt${sel === i ? " sel" : ""}" id="q${q.n}-${i}" data-q="${q.n}" data-i="${i}" aria-pressed="${sel === i}" ${extra}>${inner}</button>`;
  let body;
  if (q.rf) {
    body = `<div class="opts row">${["richtig", "falsch"].map((t, i) => btn(i, t)).join("")}</div>`;
  } else if (q.match) {
    body = `<div class="match">${[...LETTERS].map((l, i) => btn(i, l, `aria-label="Satz ${l}"`)).join("")}</div>`;
  } else {
    body = `<div class="opts">${q.opts.map((o, i) => btn(i, `<span class="key">${LETTERS[i]}</span><span>${o}</span>`)).join("")}</div>`;
  }
  return `<div class="q"><div class="q-head"><span class="num">${q.n}</span><span>${q.text}</span></div>${body}</div>`;
}

function renderTeil(t) {
  let html = `<div class="sheet"><div class="band"><span>Hören</span><small>25 Minuten</small>${EAR}</div><div class="inner">
    <h1>${t.title}</h1>
    <div class="intro">${t.intro.map(p => `<p>${p}</p>`).join("")}</div>`;
  if (t.beispiel) html += `<div class="beispiel">${t.beispiel}</div>`;
  if (t.saetze) {
    html += `<ul class="saetze">${t.saetze.map((s, i) => `<li><span class="letter">${LETTERS[i]}</span><span>${s}</span></li>`).join("")}</ul><div class="divider"></div>`;
  }
  html += t.questions.map(questionHTML).join("");
  html += `</div></div>`;
  return html;
}

function renderResult() {
  let right = 0;
  ALL.forEach(q => { if (answers[q.n] === q.answer) right++; });
  const wrong = ALL.length - right;
  const pct = Math.round(right / ALL.length * 100);
  const verdict = pct >= 60 ? "Bestanden – gut gemacht!" : "Noch nicht bestanden. Hören Sie die Texte noch einmal.";
  let html = `<div class="sheet"><div class="band"><span>Ergebnis</span><small>Übungssatz 1</small>${EAR}</div><div class="inner">
    <h1>${right} von ${ALL.length} Punkten</h1>
    <div class="score">
      <div class="tile ok"><strong>${right}</strong><span>richtig</span></div>
      <div class="tile bad"><strong>${wrong}</strong><span>falsch</span></div>
    </div>
    <p class="verdict">${pct} % · ${verdict}</p>
    <div class="review">`;
  TEILE.forEach(t => {
    html += `<div><h3>${t.title}</h3>`;
    t.questions.forEach(q => {
      const a = answers[q.n];
      const ok = a === q.answer;
      const given = a === undefined ? "keine Antwort" : optLabel(q, a);
      html += `<div class="rv"><span class="num">${q.n}</span><div>
        <div>${q.match ? q.text : q.text}</div>
        <div class="ans">Ihre Antwort: <b>${given}</b>${ok ? "" : `<br>Richtig: <b>${optLabel(q, q.answer)}</b>`}</div>
      </div><span class="mark ${ok ? "ok" : "bad"}">${ok ? "✓ richtig" : "✗ falsch"}</span></div>`;
    });
    html += `</div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function render() {
  const main = $("main");
  const done = Object.keys(answers).length;
  [...$("steps").children].forEach((s, i) => s.classList.toggle("on", i <= Math.min(page, 3)));
  $("answered").textContent = `${done} / ${ALL.length} beantwortet`;
  $("back").hidden = page === 0;

  if (page < 4) {
    $("stepName").textContent = `Teil ${page + 1} von 4`;
    main.innerHTML = renderTeil(TEILE[page]);
    $("next").textContent = page === 3 ? "Abgeben & Ergebnis sehen" : "Weiter";
    $("back").textContent = "Zurück";
    const open = ALL.length - done;
    $("note").textContent = page === 3 && open > 0
      ? `${open} Aufgabe${open === 1 ? "" : "n"} noch offen – offene Aufgaben zählen als falsch.`
      : "";
  } else {
    $("stepName").textContent = "Ergebnis";
    main.innerHTML = renderResult();
    $("next").textContent = "Noch einmal";
    $("back").textContent = "Antworten ansehen";
    $("note").textContent = "";
  }
}

$("main").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || page > 3) return;
  answers[+b.dataset.q] = +b.dataset.i;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
});

$("next").addEventListener("click", () => {
  if (page === 4) { for (const k in answers) delete answers[k]; page = 0; }
  else page++;
  render();
  window.scrollTo(0, 0);
});

$("back").addEventListener("click", () => {
  page = page === 4 ? 3 : Math.max(0, page - 1);
  render();
  window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
