<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesen Übungssatz 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one Teil per screen, exam-booklet header band, reading texts as framed notices, sticky bottom action bar */
:root {
  --bg: #eef0ee;
  --paper: #fbfcfb;
  --ink: #1d2320;
  --muted: #5c6661;
  --band: #b9bfbb;
  --band-ink: #1d2320;
  --text-bg: #e6e9e7;
  --line: #d5dad7;
  --accent: #1f7a3d;
  --accent-soft: #e2f1e6;
  --wrong: #b3261e;
  --wrong-soft: #fbe7e5;
  --font-body: "Fira Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Fira Sans Condensed", "Fira Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --paper: #1b201d; --ink: #e8ece9; --muted: #9ba59f;
    --band: #353c38; --band-ink: #e8ece9; --text-bg: #242a26; --line: #2f3632;
    --accent: #5cc47c; --accent-soft: #1d3324; --wrong: #f2857c; --wrong-soft: #3a1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --paper: #1b201d; --ink: #e8ece9; --muted: #9ba59f;
  --band: #353c38; --band-ink: #e8ece9; --text-bg: #242a26; --line: #2f3632;
  --accent: #5cc47c; --accent-soft: #1d3324; --wrong: #f2857c; --wrong-soft: #3a1f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.steps span { height: 5px; border-radius: 3px; background: var(--line); transition: background .25s; }
.steps span.on { background: var(--accent); }
.step-label { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

main {
  flex: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 130px;
}
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.band {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--band); color: var(--band-ink); padding: 10px 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
}
.band small { font-family: var(--font-body); font-weight: 500; font-size: 14px; }
.eye { width: 30px; height: 30px; border: 1.5px solid currentColor; border-radius: 4px; display: grid; place-items: center; flex: none; }
.inner { padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.intro { margin: 0; font-style: italic; color: var(--muted); font-size: 15px; }
.intro p { margin: 0 0 4px; }

/* Lesetext: framed like the paper, double rule top and bottom */
.text {
  background: var(--text-bg); padding: 14px 14px; font-size: 15px;
  border-top: 4px double var(--ink); border-bottom: 4px double var(--ink);
}
.text h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 22px; line-height: 1.15; text-wrap: balance; }
.text .kicker { font-weight: 600; font-size: 14px; color: var(--muted); }
.text p { margin: 0 0 10px; }
.text p:last-child { margin-bottom: 0; }
.text ul { margin: 0 0 10px; padding-left: 18px; }
.gap { display: inline-block; min-width: 38px; text-align: center; font-weight: 700; border-bottom: 2px solid var(--accent); padding: 0 4px; font-variant-numeric: tabular-nums; }

.beispiel { background: var(--band); color: var(--band-ink); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.beispiel b { display: block; margin-bottom: 4px; }

.q { display: flex; flex-direction: column; gap: 10px; }
.q-head { display: flex; gap: 12px; align-items: baseline; font-weight: 600; font-size: 17px; }
.num { flex: none; min-width: 26px; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; padding-left: 38px; }
.opts.row { grid-template-columns: 1fr 1fr; }
.opts.letters { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer;
  min-height: 46px; transition: border-color .15s, background .15s;
}
.opt .key { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; line-height: 1; margin-top: 1px; }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.opts.row .opt, .opts.letters .opt { justify-content: center; align-items: center; font-weight: 600; }
.opts.letters .opt { padding: 10px 0; }
.divider { height: 1px; background: var(--line); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
.btns { display: flex; gap: 10px; }
.btn {
  flex: 1; font: inherit; font-weight: 600; font-size: 17px; border-radius: 12px; padding: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); flex: 2; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.tile.ok { background: var(--accent-soft); color: var(--accent); }
.tile.bad { background: var(--wrong-soft); color: var(--wrong); }
.tile strong { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-weight: 600; font-size: 14px; }
.verdict { margin: 0; font-size: 15px; color: var(--muted); }
.review { display: grid; gap: 14px; }
.review h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; }
.rv { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.rv .num { font-size: 15px; }
.rv .ans { font-size: 13px; color: var(--muted); }
.rv .ans b { color: var(--ink); font-weight: 600; }
.mark { font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.mark.ok { background: var(--accent-soft); color: var(--accent); }
.mark.bad { background: var(--wrong-soft); color: var(--wrong); }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
.home { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="app">
  <header class="top">
    <a class="home" href="./">← Übersicht</a>

<div class="bar">
  <div class="bar-inner">

      <button class="btn" id="back" type="button">Zurück</button>
      <button class="btn primary" id="next" type="button">Weiter</button>
    </div>

</div>

<script>
const EYE = '<span class="eye" aria-hidden="true"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 7s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="10" cy="7" r="2.6"/></svg></span>';
const g = n => `<span class="gap">${n}</span>`;

// Each Teil is a list of blocks: { html } for reading texts, or a question object.
const TEILE = [
  {
    title: "Teil 1",
    intro: [
      "Sie brauchen Informationen zum Leben in Deutschland und haben sich ein Buch gekauft.",

    ],
    blocks: [

      { n: 22, text: "Sie suchen ein Geschenk für einen Bekannten. Er spielt gern am Computer.", opts: ["Elektro-Sonnemann", "Welt der Geschenke", "anderes Geschäft"], answer: 0 },

  {
    title: "Teil 3",
    intro: [

      "Entscheiden Sie bei jedem Text, ob die Aussage richtig oder falsch ist und welche Antwort (a, b oder c) am besten passt.",
      "Markieren Sie Ihre Lösungen für die Aufgaben 31–36 auf dem Antwortbogen."
    ],
    blocks: [
      { html: `<div class="text"><h2>Eine zweite Chance</h2>
        <p>In Deutschland haben 1,5 Millionen Menschen zwischen 25 und 35 keinen Berufsabschluss. Da die meisten Firmen Fachkräfte suchen, haben Personen ohne Abschluss schlechtere Chancen. Deshalb sollen sie jetzt durch das Projekt „Spätstarter“ gefördert werden. Im Gegensatz zur normalen Berufsausbildung dauert das Programm nur 24 Monate. Außerdem gehen die Teilnehmer nicht in eine Berufsschule, sondern haben ihren Unterricht zusammen mit anderen im gleichen Alter. Nach einem halben Jahr Theorieunterricht arbeiten die Teilnehmer im wöchentlichen Wechsel auch in einer Firma mit. Bezahlt wird die Ausbildung für Spätstarter aber von der Agentur für Arbeit. Das ist besonders für kleinere Firmen ein Vorteil. Insgesamt sollen durch das Projekt 70.000 junge Menschen eine zweite Chance bekommen.</p></div>` },
      { n: 31, text: "Der Text erklärt, warum viele junge Leute keinen Berufsabschluss haben.", rf: true, answer: 1 },
      { n: 32, text: "Die Auszubildenden im Projekt Spätstarter:", opts: ["arbeiten auch in einer Firma.", "besuchen eine normale Berufsschule.", "bezahlen ihre Ausbildung selbst."], answer: 0 },

      { html: `<div class="text"><h2>Erhöhung der Strompreise</h2>
        <p><b>Sehr geehrte Verbraucherinnen und Verbraucher,</b></p>
        <p>aus den Medien haben Sie sicher schon erfahren, dass in den letzten Monaten die Kosten für Strom gestiegen sind. Die Abgaben und Kosten sind aber so hoch, dass auch wir – wie viele andere Anbieter – die Preise zum 01.01. nächsten Jahres erhöhen müssen. Für unsere Kunden werden die Tarife jedoch geringer sein als bei anderen Stromanbietern. Außerdem geben wir Ihnen eine Preisgarantie für die beiden kommenden Jahre. Die Einzelheiten dazu erhalten Sie mit Ihrer nächsten Rechnung.</p>
        <p>Bei Rückfragen stehen wir Ihnen gerne telefonisch zur Verfügung. Anrufe unter der Nummer 0800-787877 sind kostenlos.</p>
        <p>Mit freundlichen Grüßen<br>Ihr Energieversorger Rheinhessen<br>Günter Baumgarten</p></div>` },
      { n: 33, text: "Die Tarife werden im nächsten Jahr erhöht.", rf: true, answer: 0 },
      { n: 34, text: "Der Energieversorger Rheinhessen", opts: ["garantiert die neuen Strompreise für zwei Jahre.", "gibt die Strompreise zum 11. bekannt.", "wird die Kunden telefonisch kontaktieren."], answer: 0 },
      { divider: true },
      { html: `<div class="text">
        <p>Sehr geehrte Frau Fuhrmann,<br>sehr geehrter Herr Fuhrmann,</p>
        <p>die von Ihnen gebuchte Reise „7-Tage-Radtour entlang der Donau“ vom 7. bis 13. Mai muss leider ausfallen, weil die erforderliche Teilnehmerzahl von 12 Personen nicht erreicht wurde. Wir bedauern das sehr, können Ihnen aber die gleiche Reise zum selben Preis für die Woche vom 11. bis 17. Juni anbieten, denn hier gibt es auch noch einige freie Plätze.</p>
        <p>Teilen Sie uns doch bitte so schnell wie möglich mit, ob Sie mit der Terminänderung einverstanden sind oder ob Sie von der Reise zurücktreten möchten. In diesem Fall überweisen wir Ihnen selbstverständlich den Betrag, den Sie schon bezahlt haben, umgehend zurück.</p>
        <p>Mit freundlichen Grüßen<br>Ihr Reisebüro „Pedalo“</p></div>` },
      { n: 35, text: "Für die Reise im Mai haben sich zu viele Leute angemeldet.", rf: true, answer: 1 },
      { n: 36, text: "Das Reisebüro", opts: ["bittet Frau und Herrn Fuhrmann, an der Reise im Mai teilzunehmen.", "fragt, ob Frau und Herr Fuhrmann die Reise im Juni machen möchten.", "hat die Bezahlung für die Reise schon zurückgezahlt."], answer: 1 }
    ]
  },
  {
    title: "Teil 4",
    intro: [
      "Lesen Sie den Text. Entscheiden Sie, ob die Aussagen 37–39 richtig oder falsch sind.",
      "Markieren Sie Ihre Lösungen für die Aufgaben 37–39 auf dem Antwortbogen."
    ],
    blocks: [
      { html: `<div class="text"><div class="kicker">Girokonto &amp; KKB Card</div><h2>Kostenloses Girokonto</h2>
        <p>Die KKB Bank bietet ein kostenloses Girokonto an, das heißt, es gibt keine Kontoführungsgebühren. Europaweit können Sie mit der KKB Card an über 20.000 Automaten unserer Money-Cash-Group kostenlos Bargeld abheben. Mit der KKB Card können Minderjährige (unter 18 Jahren) täglich bis zu 100 EUR Bargeld abheben und Volljährige bis zu 500 EUR.</p>
        <p><b>Das kostenlose Jugend-Girokonto der KKB Bank auf einen Blick</b></p>
        <ul>
          <li>Kostenlose Kontoführung</li>
          <li>Mindestalter: 16 Jahre</li>
          <li>minderjährige Personen können mit der KKB Card maximal 100 EUR täglich abheben</li>
          <li>volljährige Personen können mit der KKB Card maximal 500 EUR täglich abheben</li>
          <li>Daueraufträge, Buchungen und Lastschriften sind kostenlos</li>
          <li>Bargeldabhebungen sind an Automaten der Money-Cash-Group europaweit kostenlos</li>
          <li>bei Internetbanking ist das Konto rund um die Uhr erreichbar</li>
        </ul>
        <p>Kommen Sie einfach vorbei und beantragen Sie Ihr neues Konto. Bitte vergessen Sie nicht, einen gültigen Ausweis mitzubringen.</p>
        <p><b>Und wie soll Ihre KKB Card aussehen?</b></p>
        <p>Auch im Aussehen richtet sich die KKB Card ganz nach Ihnen: Gestalten Sie sie nach Ihren Wünschen – mit einem Foto vom Partner, Lieblingsort oder Haustier. Fragen Sie in Ihrer KKB Bank nach Ihrer persönlichen KKB Card. Nach einer Woche können Sie Ihre KKB Card in Ihrer Filiale abholen.</p></div>` },
      { n: 37, text: "Mit der KKB Card kann man nur in Deutschland Geld abheben.", rf: true, answer: 1 },
      { n: 38, text: "Für Daueraufträge muss man Gebühren zahlen.", rf: true, answer: 1 },
      { n: 39, text: "Die KKB Card sieht bei jedem Kunden gleich aus.", rf: true, answer: 1 }
    ]
  },
  {
    title: "Teil 5",
    intro: [
      "Lesen Sie den Text und schließen Sie die Lücken 40–45. Welche Lösung (a, b oder c) passt am besten?",
      "Markieren Sie Ihre Lösungen für die Aufgaben 40–45 auf dem Antwortbogen."
    ],
    blocks: [
      { html: `<div class="text">
        <p>${g("(0)")} Frau Schmitz,</p>
        <p>mein Name ist Tim Bauer und ich möchte mich für die Stelle als Bürokaufmann in Ihrem Unternehmen bewerben. ${g(40)} ich Ihre Anzeige gelesen habe, war ich sofort interessiert, da die Aufgaben ${g(41)} meinen Fähigkeiten entsprechen. Derzeit arbeite ich noch bei einer anderen Firma, ${g(42)} ich werde dort bald kündigen, um eine neue Herausforderung zu suchen.</p>
        <p>Ich habe bereits ${g(43)} in Buchhaltung und Büroorganisation gesammelt und freue mich, meine Kenntnisse in Ihrem Team einzubringen. ${g(44)} eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen. Falls Sie noch weitere Unterlagen benötigen, ${g(45)} ich Ihnen diese gerne zuschicken.</p>
        <p>Mit freundlichen Grüßen<br>Tim Bauer</p></div>` },
      { html: `<div class="beispiel"><b>Beispiel</b>(0) a Herzliche · b Liebe · <b style="display:inline">c Sehr geehrte ✓</b></div>` },
      { n: 40, text: "Lücke 40", opts: ["Als", "Wenn", "Weil"], answer: 0 },
      { n: 41, text: "Lücke 41", opts: ["genau", "kaum", "ungefähr"], answer: 0 },
      { n: 42, text: "Lücke 42", opts: ["aber", "denn", "obwohl"], answer: 0 },
      { n: 43, text: "Lücke 43", opts: ["Ahnung", "Erfahrung", "Vermutung"], answer: 1 },
      { n: 44, text: "Lücke 44", opts: ["Als", "Über", "Wegen"], answer: 1 },
      { n: 45, text: "Lücke 45", opts: ["darf", "kann", "soll"], answer: 1 }

TEILE.forEach(t => t.questions = t.blocks.filter(b => b.n));
const ALL = TEILE.flatMap(t => t.questions);
const LAST = TEILE.length - 1;
const LETTERS = "abcdefgh";
const LETTER_OPTS = [..."abcdefgh", "x"];
const answers = {};
let page = 0; // 0..LAST = Teile, LAST+1 = Ergebnis

const $ = id => document.getElementById(id);

function optLabel(q, i) {
  if (q.rf) return i === 0 ? "richtig" : "falsch";
  if (q.letters) return LETTER_OPTS[i];
  return LETTERS[i] + ") " + q.opts[i];
}

function questionHTML(q) {
  const sel = answers[q.n];
  const btn = (i, inner, extra = "") =>
    `<button type="button" class="opt${sel === i ? " sel" : ""}" id="q${q.n}-${i}" data-q="${q.n}" data-i="${i}" aria-pressed="${sel === i}" ${extra}>${inner}</button>`;
  let body;
  if (q.rf) body = `<div class="opts row">${["richtig", "falsch"].map((t, i) => btn(i, t)).join("")}</div>`;
  else if (q.letters) body = `<div class="opts letters">${LETTER_OPTS.map((l, i) => btn(i, l, `aria-label="Anzeige ${l}"`)).join("")}</div>`;
  else body = `<div class="opts">${q.opts.map((o, i) => btn(i, `<span class="key">${LETTERS[i]}</span><span>${o}</span>`)).join("")}</div>`;
  return `<div class="q"><div class="q-head"><span class="num">${q.n}</span><span>${q.text}</span></div>${body}</div>`;
}

function renderTeil(t) {
  return `<div class="sheet"><div class="band"><span>Lesen</span><small>45 Minuten</small>${EYE}</div><div class="inner">
    <h1>${t.title}</h1>
    <div class="intro">${t.intro.map(p => `<p>${p}</p>`).join("")}</div>
    ${t.blocks.map(b => b.n ? questionHTML(b) : b.divider ? '<div class="divider"></div>' : b.html).join("")}
  </div></div>`;
}

function renderResult() {
  const right = ALL.filter(q => answers[q.n] === q.answer).length;
  const wrong = ALL.length - right;
  const pct = Math.round(right / ALL.length * 100);
  const verdict = pct >= 60 ? "Bestanden – gut gemacht!" : "Noch nicht bestanden. Lesen Sie die Texte noch einmal.";
  let html = `<div class="sheet"><div class="band"><span>Ergebnis</span><small>Übungssatz 1</small>${EYE}</div><div class="inner">
    <h1>${right} von ${ALL.length} Punkten</h1>
    <div class="score">
      <div class="tile ok"><strong>${right}</strong><span>richtig</span></div>
      <div class="tile bad"><strong>${wrong}</strong><span>falsch</span></div>
    </div>
    <p class="verdict">${pct} % · ${verdict}</p>
    <div class="review">`;
  TEILE.forEach(t => {
    html += `<div><h3>${t.title}</h3>`;
    t.questions.forEach(q => {
      const a = answers[q.n];
      const ok = a === q.answer;
      const given = a === undefined ? "keine Antwort" : optLabel(q, a);
      html += `<div class="rv"><span class="num">${q.n}</span><div>
        <div>${q.text}</div>
        <div class="ans">Ihre Antwort: <b>${given}</b>${ok ? "" : `<br>Richtig: <b>${optLabel(q, q.answer)}</b>`}</div>
      </div><span class="mark ${ok ? "ok" : "bad"}">${ok ? "✓ richtig" : "✗ falsch"}</span></div>`;
    });
    html += `</div>`;
  });
  return html + `</div></div></div>`;
}

function render() {
  const done = Object.keys(answers).length;
  [...$("steps").children].forEach((s, i) => s.classList.toggle("on", i <= Math.min(page, LAST)));
  $("answered").textContent = `${done} / ${ALL.length} beantwortet`;
  $("back").hidden = page === 0;

  if (page <= LAST) {
    $("stepName").textContent = `Teil ${page + 1} von ${TEILE.length}`;
    $("main").innerHTML = renderTeil(TEILE[page]);
    $("next").textContent = page === LAST ? "Abgeben & Ergebnis sehen" : "Weiter";
    $("back").textContent = "Zurück";
    const open = ALL.length - done;
    $("note").textContent = page === LAST && open > 0
      ? `${open} Aufgabe${open === 1 ? "" : "n"} noch offen – offene Aufgaben zählen als falsch.`
      : "";
  } else {
    $("stepName").textContent = "Ergebnis";
    $("main").innerHTML = renderResult();
    $("next").textContent = "Noch einmal";
    $("back").textContent = "Antworten ansehen";
    $("note").textContent = "";
  }
}

$("main").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || page > LAST) return;
  answers[+b.dataset.q] = +b.dataset.i;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
});

$("next").addEventListener("click", () => {
  if (page > LAST) { for (const k in answers) delete answers[k]; page = 0; }
  else page++;
  render();
  window.scrollTo(0, 0);
});

$("back").addEventListener("click", () => {
  page = page > LAST ? LAST : Math.max(0, page - 1);
  render();
  window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
